
<!DOCTYPE html>
<html>
<head>
    <title>Bookhive - Book Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f1ea;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #263c50;
            color: white;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            padding: 10px;
            margin: 8px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            background-color: #486581;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #263c50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background-color: #dce5ed;
        }

        footer {
            background-color: #263c50;
            color: white;
            padding: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bookhive</h1>
        <h3>Digital Library and Book Subscription Services</h3>
    </header>

    <div class="container">

        <h2>Manage Your Books</h2>

        <input type="text" id="bookName"
               placeholder="Enter Book Name">

        <input type="text" id="author"
               placeholder="Enter Author Name">

        <select id="category">
            <option value="">Select Category</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
        </select>

        <br>

        <button onclick="addBook()">Add Book</button>

        <button onclick="getBooks()">View Books</button>

        <h2>Book Details</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookList"></tbody>
        </table>

        <p id="message"></p>

    </div>

    <footer>
        © Rights Reserved by BOOKHIVE
    </footer>

    <script>

        let books = [];

        const api =
        "https://jsonplaceholder.typicode.com/posts";

        // GET - Fetch Books
        function getBooks() {

            fetch(api)
            .then(response => {
                if (!response.ok) {
                    throw new Error("API Error");
                }
                return response.json();
            })
            .then(data => {

                books = data.slice(0, 5).map(b => ({
                    id: b.id,
                    name: b.title.substring(0, 20),
                    author: "Unknown Author",
                    category: "Education"
                }));

                displayBooks();

                document.getElementById("message").innerHTML =
                    "Books fetched successfully!";
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    "Error fetching books!";
            });
        }

        // Display Books
        function displayBooks() {

            let output = "";

            books.forEach(book => {

                output += `
                    <tr>
                        <td>${book.id}</td>
                        <td>${book.name}</td>
                        <td>${book.author}</td>
                        <td>${book.category}</td>
                        <td>
                            <button onclick="updateBook(${book.id})">
                                Update
                            </button>

                            <button onclick="deleteBook(${book.id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;

            });

            document.getElementById("bookList").innerHTML = output;
        }

        // POST - Add Book
        function addBook() {

            let name =
                document.getElementById("bookName").value.trim();

            let author =
                document.getElementById("author").value.trim();

            let category =
                document.getElementById("category").value;

            // Input Validation
            if (name === "" || author === "" || category === "") {
                alert("Please enter all book details!");
                return;
            }

            fetch(api, {
                method: "POST",
                body: JSON.stringify({
                    title: name,
                    author: author,
                    category: category
                }),
                headers: {
                    "Content-type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {

                books.push({
                    id: data.id,
                    name: name,
                    author: author,
                    category: category
                });

                displayBooks();

                document.getElementById("bookName").value = "";
                document.getElementById("author").value = "";
                document.getElementById("category").value = "";

                document.getElementById("message").innerHTML =
                    "Book added successfully!";
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    "Error adding book!";
            });
        }

        // PUT - Update Book
        function updateBook(id) {

            let name = prompt("Enter new book name:");

            if (name === null || name.trim() === "") {
                alert("Invalid book name!");
                return;
            }

            fetch(api + "/" + id, {
                method: "PUT",
                body: JSON.stringify({
                    title: name
                }),
                headers: {
                    "Content-type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {

                let book = books.find(b => b.id === id);

                if (book) {
                    book.name = name.trim();
                }

                displayBooks();

                document.getElementById("message").innerHTML =
                    "Book updated successfully!";
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    "Error updating book!";
            });
        }

        // DELETE - Remove Book
        function deleteBook(id) {

            if (!confirm("Are you sure you want to delete this book?")) {
                return;
            }

            fetch(api + "/" + id, {
                method: "DELETE"
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                books = books.filter(b => b.id !== id);

                displayBooks();

                document.getElementById("message").innerHTML =
                    "Book deleted successfully!";
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    "Error deleting book!";
            });
        }

    </script>

</body>
</html>
